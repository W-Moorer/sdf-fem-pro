[build-system]
requires = ["setuptools>=68", "pybind11>=2.11"]
build-backend = "setuptools.build_meta"

[project]
name = "sfc"
version = "0.1.0"
description = "Standalone FEM-induced SDF contact solver package skeleton."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "sdf-fem-pro contributors" }
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.optional-dependencies]
validation = [
  "scikit-fem>=11",
]
dev = [
  "pytest>=7.4",
  "scikit-fem>=11",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
